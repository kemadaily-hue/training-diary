<title>🏋️训练日记</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Fredoka:wght@500;600&family=ZCOOL+KuaiLe&family=Anton&family=Noto+Sans+SC:wght@700;900&family=Barlow+Condensed:ital,wght@1,700&display=swap">
<style>
/* 布局:单列手机优先。顶部日期条,中间按「分类 → 部位 → 动作」的清单,底部三个标签页;录入在底部弹出的面板里完成。 */
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --sunken:#E8ECEF; --ink:#14181D; --muted:#5C6672; --line:#D9DEE3;
  --accent:#1F4FD8; --on-accent:#FFFFFF; --good:#17824F; --warn:#B25E00; --bad:#C2372D;
  --g-upper:#1F4FD8; --g-lower:#D43A2F; --g-core:#B98300; --g-cardio:#0E8F7E; --mu-t:#F2B705; --mu-y:#7D8690;
  --num:"Barlow Condensed","DIN Alternate","Roboto Condensed",system-ui,sans-serif;
  --body:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#181C22; --sunken:#20252C; --ink:#E9EDF1; --muted:#98A3AE; --line:#2B323A;
  --accent:#7598FF; --on-accent:#0B1020; --good:#4CC38A; --warn:#E7A14A; --bad:#FF7468;
  --g-upper:#7598FF; --g-lower:#FF7468; --g-core:#E4B33C; --g-cardio:#3CC9B4; --mu-t:#FFCB2E; --mu-y:#8E98A3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#181C22; --sunken:#20252C; --ink:#E9EDF1; --muted:#98A3AE; --line:#2B323A;
  --accent:#7598FF; --on-accent:#0B1020; --good:#4CC38A; --warn:#E7A14A; --bad:#FF7468;
  --g-upper:#7598FF; --g-lower:#FF7468; --g-core:#E4B33C; --g-cardio:#3CC9B4; --mu-t:#FFCB2E; --mu-y:#8E98A3; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{touch-action:pan-x pan-y}
/* 像原生 App 一样:界面文字不能长按选中复制;输入框和聊天消息除外 */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],.ch-bub:not(.plan){-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(68px + env(safe-area-inset-bottom,0px))}

/* 顶部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;gap:8px}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--bad)}
.datebar{display:flex;align-items:center;gap:6px}
.datebar .lbl{flex:1;min-width:0;font-weight:600}
.datebar .lbl small{color:var(--muted);font-weight:400;margin-left:6px}
.ibtn{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.tbtn{height:40px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px}
#datePick{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px;width:44px;color:transparent}
#datePick::-webkit-calendar-picker-indicator{margin:0;opacity:.8}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:9px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button .n{font-weight:700;display:flex;align-items:center;gap:6px}
.seg button .c{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.upper{background:var(--g-upper)} .dot.lower{background:var(--g-lower)} .dot.core{background:var(--g-core)} .dot.cardio{background:var(--g-cardio)}

.banner{background:var(--surface);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}

/* 清单 */
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 2px;font-size:13px;color:var(--muted)}
.tools label{display:flex;align-items:center;gap:6px}
.part{margin-top:14px}
.part h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ex{display:grid;grid-template-columns:22px minmax(0,1fr) 3.2em auto minmax(34px,10%);align-items:center;gap:8px;width:100%;text-align:left;padding:10px;min-height:58px}
.ex .nm{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.ex .tg{display:flex;gap:4px;flex-wrap:wrap}
.ex .wc{text-align:right;line-height:1.1;min-width:0}
.ex .wc b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
.ex .wc small{font-size:11px;color:var(--muted)}
.ex .rs{grid-template-columns:repeat(4,1.75em)}
.ex .ag{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
/* 录入面板固定用浅色,和深色页面拉开对比 */
.panel{--bg:#FFFFFF;--surface:#F1F3F5;--sunken:#E3E7EB;--ink:#14181D;--muted:#5C6672;--line:#C9D0D7;--accent:#1F4FD8;--on-accent:#FFFFFF;--good:#17824F;--warn:#B25E00;--bad:#C2372D;color:var(--ink);color-scheme:light;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
/* 录入面板压缩到一屏 */
.panel .p-head{align-items:center;margin-bottom:10px}
.panel .p-head h2{font-size:18px;text-align:center;overflow-wrap:anywhere}
.panel .p-head .ghost,.panel .p-head .primary{min-height:40px;padding:8px 14px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.opts .chip,.opts .chip-in{min-height:34px;padding:5px 11px;font-size:13px}
.panel .fld{margin-bottom:8px}
.panel .col .fail{height:32px}
.panel .row-btns{margin:8px 0 0;gap:6px;align-items:center}
.panel .row-btns .ghost{min-height:40px;padding:8px 11px;font-size:13px}
.panel .row-btns .danger{margin-left:auto;padding:8px 0}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-h b{flex:1;text-align:center;font-size:16px}
.cal-h b small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-g .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cd{min-height:56px;border-radius:7px;background:var(--sunken);padding:4px 1px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cd.x{background:none}
.cd b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;color:var(--muted);line-height:1.1}
.cd.on b{color:var(--ink);font-weight:600}
.cd.td{box-shadow:inset 0 0 0 2px var(--ink)}
.ps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;width:100%}
.ps i,.ps1{font-style:normal;font-size:10px;line-height:1.4;min-height:14px;text-align:center;border-radius:3px;color:var(--ink)}
.ps1{display:inline-block;width:16px;font-size:11px;margin-right:2px}
.ps i.upper,.ps1.upper{background:color-mix(in oklab,var(--g-upper) 32%,var(--surface))}
.ps i.lower,.ps1.lower{background:color-mix(in oklab,var(--g-lower) 32%,var(--surface))}
.ps i.core,.ps1.core{background:color-mix(in oklab,var(--g-core) 36%,var(--surface))}
.ps i.cardio,.ps1.cardio{background:color-mix(in oklab,var(--g-cardio) 34%,var(--surface))}
.cal-l{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.cal-l span,.cal-ps span{display:inline-flex;align-items:center;gap:5px}
.cal-g{gap:6px 4px}
.cday{position:relative;min-height:52px;min-width:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 2px 4px;color:var(--muted)}
.cday b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;line-height:1.1}
.cday.on{background:var(--sunken);color:var(--ink)}
.cday.on b{font-weight:700}
.cday.td b{color:var(--accent)}
.cday.td{box-shadow:inset 0 0 0 1.5px var(--accent)}
.ctags{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:42px}
.ctags i{font-style:normal;font-size:9px;line-height:12px;width:12px;height:12px;text-align:center;border-radius:3px;color:var(--ink)}
.ctags i.upper{background:color-mix(in oklab,var(--g-upper) 30%,var(--surface))}
.ctags i.lower{background:color-mix(in oklab,var(--g-lower) 30%,var(--surface))}
.ctags i.core{background:color-mix(in oklab,var(--g-core) 36%,var(--surface))}
.ctags i.cardio{background:color-mix(in oklab,var(--g-cardio) 34%,var(--surface))}
.ctags i.stretch{background:color-mix(in oklab,var(--g-stretch,#9B6BE0) 32%,var(--surface))}
.sect{margin-top:18px}
.sect h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:7px}
.mods{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-auto-rows:minmax(92px,auto);gap:8px}
.mod{height:100%;justify-content:center}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mod .pn{font-weight:600}
.mod .ct{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;line-height:1.15}
.mod .ct.z{color:var(--muted)}
.mod .wn{font-size:12px;font-weight:700;color:var(--muted)}
.mod .wn.d0{color:var(--good)} .mod .wn.d1{color:var(--muted)} .mod .wn.d2{color:var(--g-core)}
.ex.prev .wc,.ex.prev .rs{opacity:.42}
.part h2.ph{font-size:17px;color:var(--ink);align-items:center}
.ex .ag.d0{color:var(--good);font-weight:700}
.ex .ag.d1{color:var(--muted);font-weight:700}
.ex .ag.d2{color:var(--g-core);font-weight:700}
.wbox{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.wbox::after{content:"";position:absolute;left:4px;right:4px;top:40px;height:40px;border-block:2px solid var(--line);pointer-events:none}
.wbox.on::after{border-color:var(--accent)}
.wheel{height:120px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;-webkit-mask-image:linear-gradient(transparent,#000 36%,#000 64%,transparent);mask-image:linear-gradient(transparent,#000 36%,#000 64%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .wp{height:40px}
.wheel .it{height:40px;scroll-snap-align:center;display:grid;place-items:center;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;color:var(--muted)}
.wbox.on .it{color:var(--ink)}
.wbox:not(.on) .wheel{opacity:.35}
.ex:not(.done) .wc b,.ex:not(.done) .rs i{color:var(--muted)}
.ex + .ex{border-top:1px solid var(--line)}
.ex .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:transparent}
.ex.done .ck{background:var(--good);border-color:var(--good);color:var(--surface)}
.ex .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex .nm{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ex .sb{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ex.done .sb{color:var(--ink)}
.ex .sb .num{font-size:16px}
.ex .cv{color:var(--muted);font-size:18px}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);font-weight:500;white-space:nowrap}
.cpd{display:inline-block;font-size:10px;font-weight:700;line-height:1.6;padding:0 6px;border-radius:999px;background:color-mix(in oklab,var(--warn) 16%,var(--surface));color:var(--warn);border:1px solid color-mix(in oklab,var(--warn) 45%,transparent);margin-right:4px;vertical-align:2px;white-space:nowrap}
.tag.pr{border-color:var(--good);color:var(--good)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.add{margin-top:12px;width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.note-box{margin-top:18px}
.note-box label,.fld label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
textarea,.txt{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:64px;resize:vertical}

/* 底部标签 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs{z-index:30}
.tabs button{height:52px;padding:0;font-weight:600;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}

/* 录入面板 */
.sheet{position:fixed;inset:0 0 calc(52px + env(safe-area-inset-bottom,0px)) 0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.p-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.p-head h2{font-size:20px;margin:0;flex:1;min-width:0}
.p-head .sub{font-size:13px;color:var(--muted);font-weight:400;display:block;margin-top:2px}
.primary{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.ref b{font-weight:600}
.ref .num{font-size:16px}
.fld{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-in{width:96px;border-radius:999px;border:1px dashed var(--line);background:var(--surface);padding:8px 12px;font-size:14px;min-height:38px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.col{display:flex;flex-direction:column;gap:5px;min-width:0}
.col .ix{font-size:12px;color:var(--muted);text-align:center}
.col input{width:100%;min-width:0;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:center;padding:0 2px;font-family:var(--num);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.col input.w{height:40px;font-size:19px;font-weight:500;background:var(--sunken)}
.col input::placeholder{color:var(--muted);opacity:.38;font-weight:500;font-size:17px}

.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 52px 34px;gap:6px;align-items:center}
.set.time{grid-template-columns:22px 1fr 34px}
.set .ix{color:var(--muted);font-size:13px;text-align:center}
.set .box{position:relative}
.set input{width:100%;height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 34px 0 12px;font-family:var(--num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.set input::placeholder{color:var(--muted);opacity:.36;font-weight:500}
.set .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.set .fail{height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted)}
.set .fail[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);font-weight:700}
.set .del{height:50px;color:var(--muted);font-size:18px}
.set-head{display:grid;grid-template-columns:22px 1fr 1fr 52px 34px;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.set-head.time{grid-template-columns:22px 1fr 34px}
.row-btns{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-size:14px}
.danger{color:var(--bad);font-size:13px;padding:10px 0}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}

/* 进步 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .v{font-family:var(--num);font-size:30px;font-weight:600;line-height:1.1}
.tile .k{font-size:12px;color:var(--muted)}
.sec{margin-top:22px}
.sec > h2{font-size:16px;margin:0 0 2px}
.sec > p{font-size:13px;color:var(--muted);margin:0 0 10px}
.heat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}
.heat th{font-weight:500;color:var(--muted);text-align:center;padding:2px;white-space:nowrap}
.heat th.p{text-align:left;color:var(--ink);font-weight:600;font-size:13px}
.heat td{text-align:center;height:30px;min-width:30px;border-radius:6px;background:var(--sunken);font-family:var(--num);font-size:15px;font-variant-numeric:tabular-nums}
.heat td.h1{background:color-mix(in oklab,var(--accent) 16%,var(--surface))}
.heat td.h2{background:color-mix(in oklab,var(--accent) 30%,var(--surface))}
.heat td.h3{background:color-mix(in oklab,var(--accent) 44%,var(--surface))}
.heat td.h4{background:color-mix(in oklab,var(--accent) 60%,var(--surface))}
.heat td.z{color:var(--muted)}
.heat td.ago{background:none;text-align:right;font-family:var(--body);font-size:12px;color:var(--muted);white-space:nowrap;padding-left:4px}
.heat td.ago.warn{color:var(--warn);font-weight:600}
.pl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;min-height:56px}
.pl + .pl{border-top:1px solid var(--line)}
.pl .m{flex:1;min-width:0}
.pl .nm{font-weight:600}
.pl .sb{font-size:12px;color:var(--muted)}
.pl .val{text-align:right;white-space:nowrap}
.pl .val .num{font-size:20px;font-weight:600}
.pl .val small{display:block;font-size:12px;color:var(--muted)}
.pl .val small.up{color:var(--good)} .pl .val small.down{color:var(--bad)}
.back{color:var(--accent);font-weight:600;padding:8px 0;margin-top:2px}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;top:6px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:8px;padding:5px 9px;font-size:12px;pointer-events:none;white-space:nowrap;text-align:center}
.tip b{font-family:var(--num);font-size:16px}
.mlg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin-bottom:8px}
.mlg-i{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--ink);min-width:0}
.mlg-i.off{opacity:.4}
.clg{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 6px;padding:2px 4px 6px}
.clg-i{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;color:var(--ink);background:var(--sunken);border:1px solid transparent}
.chart .clg-i svg{width:22px;height:8px;flex:none;display:inline-block}
.clg-i{white-space:nowrap}
.clg-i.off{opacity:.45;text-decoration:line-through;background:none;border-color:var(--line)}
.mlg-k{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.mlg-k i{width:10px;height:3px;border-radius:2px}
.mlg-i b{font-size:19px;line-height:1.1}.mlg-i b em{font-style:normal;font-size:11px;color:var(--muted);margin-left:2px;font-family:var(--body)}
.mlg-i small{font-size:11px;font-weight:700;color:var(--muted)}.mlg-i small.up{color:var(--good)}.mlg-i small.down{color:var(--bad)}
.tip .tl{display:flex;align-items:center;gap:5px;justify-content:flex-start}.tip .tl i{width:8px;height:3px;border-radius:2px;flex:none}
.mnote{white-space:normal;margin:8px 2px 0;font-size:11px}
details.pdays{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
details.pdays>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:14px}
details.pdays>summary::-webkit-details-marker{display:none}
details.pdays>summary small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
details.pdays[open]>summary .chev{transform:rotate(-135deg)}
details.pdays .tbl{margin-top:0}
.tbl td.pd-n{font-size:12px;color:var(--muted)}
.tbl td.num{font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl td.num{font-size:16px;white-space:nowrap}

/* 历史 */
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-h b{font-size:16px}
.day-h .sp{flex:1}
.day-h button{color:var(--accent);font-size:13px;font-weight:600;padding:6px 0}
.day dl{margin:0;display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;font-size:13px;align-items:center}
.day dt{color:var(--muted);white-space:nowrap}
.day dd{margin:0;min-width:0;overflow-wrap:anywhere}
.day .gp{grid-column:1/-1;font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:6px}
.day .dn{margin-top:8px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
@media (prefers-reduced-motion:no-preference){ .panel{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }

/* 按钮点击反馈:小按钮按下时缩小,整行按下时底色变深 */
button{transition:transform .12s ease,background-color .15s ease,opacity .15s ease;touch-action:manipulation}
button:active{opacity:.85}
@media (prefers-reduced-motion:no-preference){
  button:not(.ex):not(.pl):not(.add):active{transform:scale(.94)}
  .add:active{transform:scale(.98)}
  .ex .ck{transition:transform .18s cubic-bezier(.3,1.6,.5,1),background-color .15s ease,border-color .15s ease}
  .ex:active .ck{transform:scale(.85)}
  .ex.done .ck{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
}
.ex:active,.pl:active{background:var(--sunken);opacity:1}
/* 首页部位大按钮:按下缩小+底色变深+边框高亮 */
.mod{transition:transform .14s ease,background-color .15s ease,border-color .15s ease,box-shadow .15s ease}
.mod:active{background:var(--sunken);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);opacity:1}
@media (prefers-reduced-motion:no-preference){
  .mod:active{transform:scale(.93)}
  .ex:active,.pl:active{transform:scale(.985)}
}
/* 手指按下瞬间的状态(脚本加 .pressed,按下时不过渡,立刻生效) */
button.pressed{transition-duration:0s;opacity:.8}
.mod.pressed{background:var(--sunken);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);opacity:1}
.ex.pressed,.pl.pressed,.add.pressed{background:var(--sunken);opacity:1}
@media (prefers-reduced-motion:no-preference){
  button.pressed{transform:scale(.93)}
  .mod.pressed{transform:scale(.93)}
  .ex.pressed,.pl.pressed,.add.pressed{transform:scale(.985)}
}

/* 肌肉图 */
.musc-legend{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--muted);margin:6px 0 10px}
.musc-legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.musc-legend .k0{background:var(--mu-t)} .musc-legend .k1{background:var(--mu-y)}
.exmu-b{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;vertical-align:3px}
.demo-h{font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 8px}
.demo-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.demo-box svg{display:block;width:100%;height:auto;max-height:46vh}
.demo-box .al{stroke:var(--ink);stroke-linecap:round;fill:none}.demo-box .af .al{stroke:var(--muted);opacity:.55}.demo-box .ah,.demo-box .atb{fill:var(--ink)}
.demo-box .ap{fill:color-mix(in oklab,var(--muted) 30%,var(--surface))}.demo-box .apl{stroke:var(--muted);stroke-linecap:round}.demo-box .apc{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
.demo-box .adb rect{fill:var(--muted)}.demo-box .apt{fill:none;stroke:var(--muted);stroke-width:4}.demo-box .afl{stroke:var(--line);stroke-width:2}
.demo-tips{margin:10px 0 6px;padding-left:20px;font-size:14px;line-height:1.55;display:flex;flex-direction:column;gap:4px}
.demo-link{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:4px 0}
.exmu-l{margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}.exmu-l b{display:inline-block;min-width:3em;color:var(--muted);font-weight:600;font-size:12px}
.musc-lab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 6px}
.musc-lab svg{width:100%;height:auto;display:block}
.ml-t{font-size:21px;font-weight:600;fill:var(--ink)}.ml-c{font-size:17px;fill:var(--muted)}
.ml-l{fill:none;stroke:var(--ink);stroke-width:1.8;opacity:.6}.ml-d{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.ml-n{margin:2px 0 0;text-align:center;font-size:11px;color:var(--muted)}
.musc-figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px 8px}
.musc-figs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.musc-figs figcaption{font-size:12px;color:var(--muted)}
.musc-figs svg{width:100%;max-width:220px;height:auto;display:block}
.mu{fill:color-mix(in oklab,var(--muted) 22%,var(--surface));stroke:var(--surface);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.mu.t1{fill:var(--mu-y)}
.mu.t0{fill:var(--mu-t)}
.nt{fill:color-mix(in oklab,var(--muted) 14%,var(--surface));stroke:var(--surface);stroke-width:1.6}
.ab-ln{stroke:var(--surface);stroke-width:1.4;fill:none;pointer-events:none}
.musc-days{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.musc-day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.musc-day h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.musc-day h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.musc-day ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px}
.musc-day li b{font-weight:600;margin-right:6px}
.musc-day li span{color:var(--muted)}
.musc-day .none{color:var(--muted);font-size:13px}

/* 首页状态分组 */
.sect h2 .sc{font-family:var(--num);font-size:16px;color:var(--muted);font-weight:600}
.sect h2 small{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}

/* 进步页:今天 vs 上次 */
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 14px}
.cmp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.cmp-h b{font-size:16px}
.cmp-h small{color:var(--muted);font-size:12px;margin-left:auto}
.cmp-empty{color:var(--muted);font-size:13px;padding:6px 0 2px}
.cmp-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cmp-big .num{font-size:40px;font-weight:600;line-height:1;color:var(--good)}
.cmp-big small{font-size:14px;color:var(--muted);margin-left:4px}
.cmp-k{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.cmp-k i{font-style:normal;font-size:18px;font-weight:600;color:var(--ink);margin-right:3px}
.cmp-list{display:flex;flex-direction:column}
.cmp-row{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:10px 0}

.cmp-rh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cmp-rh b{font-weight:600;display:flex;align-items:center;gap:6px}

.cmp-rh small em{font-style:normal;color:var(--good);font-weight:600}
.cmp-sub{font-size:13px;color:var(--muted)}
.cmp-sub .num{font-size:15px;color:var(--ink)}
.cmp-sub em{font-style:normal;font-weight:700}.cmp-sub em.g{color:var(--good)}.cmp-sub em.d{color:var(--muted)}
.bd{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;color:var(--good);border:1px solid color-mix(in oklab,var(--good) 60%,transparent);background:color-mix(in oklab,var(--good) 12%,var(--surface))}
.bd.w{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 60%,transparent);background:color-mix(in oklab,var(--warn) 12%,var(--surface))}
.cmp-sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.cs{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:8px;background:var(--sunken);min-width:0}
.cs b{font-size:16px;font-weight:600;line-height:1.2}
.cs i{font-style:normal;font-size:12px;color:var(--muted)}
.cs em{font-style:normal;font-size:10px;font-weight:700;color:var(--good);min-height:13px;white-space:nowrap}
.cs.up{background:color-mix(in oklab,var(--good) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--good) 55%,transparent)}
.cs.up b{color:var(--good)}

/* 进步对比方块 */
.cmp{background:none;border:0;padding:0}
.cmp-sum{display:flex;gap:16px;flex-wrap:wrap;border:0;padding:2px 0 0}
.cmp-sum .k{font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:4px}

.cmp-sum .k.up i{color:var(--good)} .cmp-sum .k.down i{color:var(--bad)} .cmp-sum .k.same i{color:var(--muted)} .cmp-sum .k.w i{color:var(--warn)}
.cmp-g{margin-top:14px}
.cmods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cmod{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center}

.cmod.down{border-color:var(--bad)} .cmod.down .cb{color:var(--bad)}

/* 设置 */

.chip.lib[aria-pressed="true"]{background:color-mix(in oklab,var(--accent) 18%,var(--surface));color:var(--ink);border-color:var(--accent)}
.onboard{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.onboard b{font-size:17px}.onboard p{margin:0;color:var(--muted);font-size:14px;max-width:30em}
.tabs button{font-size:14px}

/* 首页视图切换 */
.vsw{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;border-radius:10px;background:var(--sunken);margin-top:10px}
.vsw button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.vsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mod.ph-add{border-style:dashed;background:none;color:var(--muted)}
.mod.ph-add .pa{font-size:30px;line-height:1.1;font-weight:300}
.vlg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.vlg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.vlg i.todo{border-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
.vlg i.done{border-color:var(--good);background:color-mix(in oklab,var(--good) 25%,transparent)}
.vlg i.rest{border-style:dashed}
.mod.done{border-color:color-mix(in oklab,var(--good) 55%,var(--line))}

/* 设置:折叠 + 颜色模式 */
.vsw.th3{grid-template-columns:repeat(3,1fr);margin-top:4px}
details.fold{border-top:1px solid var(--line);padding-top:4px}
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:10px 0;min-height:44px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary h2{font-size:17px;margin:0;display:flex;align-items:baseline;gap:6px}
details.fold > summary h2 .sc{font-family:var(--num);font-size:16px;color:var(--muted)}
details.fold > p{font-size:13px;color:var(--muted);margin:0 0 10px}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:6px;transition:transform .15s}
details[open] > summary .chev{transform:rotate(-135deg)}

/* 打气 */
.ch-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px}
.ch-box label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.ch-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px}
.ch-row .chips{flex:1;min-width:0}
#cheerList{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ch-msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ch-msg.me{border-color:color-mix(in oklab,var(--accent) 40%,var(--line))}
.ch-h{display:flex;align-items:baseline;gap:8px;font-size:13px}
.ch-h b{font-size:14px}
.ch-h span{color:var(--muted);font-size:12px}
.ch-del{margin-left:auto;font-size:12px;color:var(--muted);padding:2px 4px}
.ch-t{margin-top:4px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.tabs button{font-size:13px}

/* 进步 / 历史 折叠 */
.sec > details.fold{border-top:0;padding-top:0}
.sec > details.fold > summary{padding:4px 0}
.sec > details.fold > summary h2{font-size:16px}
.sec > details.fold > p{font-size:13px;color:var(--muted);margin:0 0 10px}
details.hday > summary{list-style:none;cursor:pointer;align-items:center}
details.hday > summary::-webkit-details-marker{display:none}
details.hday > summary .chev{margin-left:8px}
details.hday[open] > summary .chev{transform:rotate(-135deg)}
details.hday:not([open]) > summary{margin-bottom:0}
.hd-f{display:flex;justify-content:flex-end;margin-top:8px}
.hd-f button{font-size:13px;color:var(--accent);font-weight:600;padding:6px 0}

/* 首页:视图切换 + 肌肉图入口;肌肉图弹窗 */
.home-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
.home-bar .vsw{margin-top:0}
.mm-open{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0}
.mm{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.mm-card{border:1.5px solid color-mix(in oklab,var(--ink) 22%,transparent);background:var(--bg);color:var(--ink);width:100%;max-width:480px;max-height:90%;overflow:auto;border-radius:16px;padding:12px 14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mm-h b{font-size:17px}
.mm-x{width:40px;height:40px;border-radius:50%;font-size:24px;color:var(--muted);display:grid;place-items:center}
@media (prefers-reduced-motion:no-preference){.mm:not([hidden]) .mm-card{animation:mmIn .16s ease-out}@keyframes mmIn{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}}

.top-row .dctl{display:flex;align-items:center;gap:6px}
.top-row .dctl[hidden]{display:none}
.top-row h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-row{display:flex;justify-content:flex-start;margin-top:14px}

.tabs button{position:relative}
.tabs button.unread::after{content:"";position:absolute;top:9px;left:calc(50% + 16px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}

/* 设置:保存 */
.save-bar{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));margin-top:16px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:4}
.save-bar .sb-t{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.save-bar .sb-t b{font-size:15px;color:var(--ink)}
.save-bar .sb-b{display:flex;gap:8px;justify-content:flex-end}
.save-bar .primary{min-width:96px}
.save-msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}
.save-msg.ok{color:var(--good);background:color-mix(in oklab,var(--good) 12%,var(--surface));border:1px solid color-mix(in oklab,var(--good) 45%,transparent)}
.save-msg.err{color:var(--bad);background:color-mix(in oklab,var(--bad) 12%,var(--surface));border:1px solid color-mix(in oklab,var(--bad) 45%,transparent)}
.tabs button.unsaved::after{content:"";position:absolute;top:9px;left:calc(50% + 16px);width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}

/* 录入面板:重量 / 次数 标注清楚 */
.col .ix{font-weight:600;color:var(--ink)}
.col .lab{font-size:11px;color:var(--muted);text-align:center;margin-top:2px;line-height:1}
.wwrap{position:relative}
.panel .col input.w{height:46px;font-size:22px;font-weight:600;background:var(--bg);border:1.5px solid var(--ink);padding:0 4px;text-align:center}
.panel .col .wwrap.hasu input.w{padding:0 18px}
.panel .col input.w:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent);outline:0}
.wwrap .wu{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}

/* 训练动作:左未选 / 右已选 */
.pick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;scroll-margin-top:12px}
.pick h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.pick h3 small{font-size:12px;font-weight:400;color:var(--muted)}
.pick h3 .pc{margin-left:auto;font-size:12px;font-weight:600;color:var(--good)}
.pk-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk-col{display:flex;flex-direction:column;gap:5px;min-width:0;padding:6px;border-radius:10px;background:var(--sunken)}
.pk-col.sel{background:color-mix(in oklab,var(--good) 12%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--good) 40%,transparent)}
.pk-t{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;padding:0 2px 2px}
.pk-col.sel .pk-t{color:var(--good)}
.pk{text-align:left;padding:7px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.pk.on{border-color:color-mix(in oklab,var(--good) 55%,var(--line));font-weight:600;display:flex;justify-content:space-between;gap:6px}
.pk.on span{color:var(--muted);font-weight:400}
.pk-e{font-size:12px;color:var(--muted);padding:4px 2px}

/* 要练的口径 */
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rule.chg{border-color:var(--accent)}
.rule .rl{display:flex;flex-direction:column;gap:2px;min-width:0}
.rule .rl b{display:flex;align-items:center;gap:6px;font-size:15px}
.rule .rl span{font-size:12px;color:var(--muted)}
.rs-step{display:flex;align-items:center;gap:6px;flex:none}
.rs-step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sunken);font-size:20px;line-height:1}
.rs-step button:disabled{opacity:.35}
.rs-step .rv{min-width:4.2em;text-align:center;font-size:12px;color:var(--muted)}
.rs-step .rv b{font-size:22px;color:var(--ink);font-weight:600;margin-right:2px}
.rule-eg{font-size:12px;color:var(--muted);margin:8px 0 0}
.rule-bar{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

/* 有氧录入 */
.csegs{display:flex;flex-direction:column;gap:10px}
.cseg{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.cs-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.cs-h .danger{padding:0}
.cs-f{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.cf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.cin{width:100%;min-width:0;height:48px;border-radius:10px;border:1.5px solid var(--ink);background:var(--bg);text-align:center;font-family:var(--num);font-size:22px;font-weight:600;padding:0 26px 0 4px;font-variant-numeric:tabular-nums}
.cin:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent)}
.ex .rs.cdx{display:block;font-size:12px;color:var(--muted);white-space:normal;line-height:1.3;width:121px;min-height:1px}
.nr.cdt{white-space:normal}

/* 训练动作:每个部位可折叠 */
.acts > h2{font-size:17px;margin:0 0 2px;display:flex;align-items:baseline;gap:6px}
.acts > h2 .sc{font-family:var(--num);font-size:16px;color:var(--muted)}
.acts > p{font-size:13px;color:var(--muted);margin:0 0 10px}
details.pick > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px}
details.pick > summary::-webkit-details-marker{display:none}
.pk-sum{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pk-sum b{display:flex;align-items:center;gap:6px;font-size:15px}
.pk-names{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.pick[open] .pk-names{display:none}
details.pick > summary .pc{font-size:12px;font-weight:600;color:var(--good);white-space:nowrap}
details.pick[open] > summary{margin-bottom:8px}
details.pick[open] > summary .chev{transform:rotate(-135deg)}

/* 设置:经典菜单样式 */
.menu-lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin:20px 6px 6px}
.menu-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex-wrap:wrap}
.mi-t{font-size:16px;font-weight:600;white-space:nowrap}
.menu-row .vsw.th3{margin-top:0}
details.menu-item > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px;min-height:52px}
details.menu-item > summary::-webkit-details-marker{display:none}
details.menu-item > summary .mi-v{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
details.menu-item[open] > summary{border-bottom:1px solid var(--line)}
details.menu-item[open] > summary .chev{transform:rotate(-135deg)}
.mi-body{padding:12px}
.mi-body > p,.mi-p{font-size:13px;color:var(--muted);margin:0 0 10px}
.menu-card .pick,.menu-card .rule{background:var(--bg)}
.menu-card .pick:last-child{margin-bottom:0}
.mi-body .save-msg{margin:0 0 10px}

/* 部位合并 */
.menu-card > details.menu-item + details.menu-item{border-top:1px solid var(--line)}
.mg-list{display:flex;flex-direction:column;gap:8px}
.mg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.mg-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.mg-n{font-size:12px;color:var(--muted)}
.mg-h b{font-size:16px}
.mg-rows{display:flex;flex-direction:column}
.mg-r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
.mg-r + .mg-r{border-top:1px dashed var(--line)}
.mg-r span{display:flex;align-items:center;gap:6px;font-weight:600}
.mg-r select{max-width:62%;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 8px;font-size:13px}

/* 部位合并:方块 + 拖拽 */
.gboxes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbox{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px;min-height:92px;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,background-color .12s}
.gbox.empty{border-style:dashed}
.gbox.can{border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}
.gbox.over{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--bg))}
.gb-h{display:flex;align-items:baseline;gap:6px;min-width:0}
.gb-h span{font-size:11px;color:var(--muted);white-space:nowrap}
.gb-h b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbox.empty .gb-h b{color:var(--muted);font-weight:500}
.gb-c{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-content:flex-start}
.gb-e{font-size:12px;color:var(--muted);margin:auto}
.gchip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface);border:1.5px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.gchip.c-upper{border-color:color-mix(in oklab,var(--g-upper) 60%,var(--line))}
.gchip.c-lower{border-color:color-mix(in oklab,var(--g-lower) 60%,var(--line))}
.gchip.c-core{border-color:color-mix(in oklab,var(--g-core) 60%,var(--line))}
.gchip.c-cardio{border-color:color-mix(in oklab,var(--g-cardio) 60%,var(--line))}
.gchip.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.gchip.lifting{opacity:.3}
.gchip.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,.35);background:var(--surface);color:var(--ink)}
.gadd{border-style:dashed;color:var(--muted);font-size:14px;font-weight:600;align-items:center;justify-content:center}

/* ===== 主题:粉粉可爱(只有亮色;放在最后,覆盖默认配色) ===== */
:root[data-skin="cute"]{
  --bg:#FFF4F7; --surface:#FFFFFF; --sunken:#FFE6EE; --ink:#5A3A45; --muted:#B07F8E; --line:#F6D0DC;
  --accent:#FF6F9C; --on-accent:#FFFFFF; --good:#2FB884; --warn:#FF9147; --bad:#F04E78;
  --g-upper:#FF8FB3; --g-lower:#A98BEF; --g-core:#FFBE4D; --g-cardio:#4CC8B2; --mu-t:#FFC94D; --mu-y:#C4A7B1;
  --num:"Fredoka","Barlow Condensed",system-ui,sans-serif;
  --cute:"ZCOOL KuaiLe",-apple-system,"PingFang SC",system-ui,sans-serif;
  color-scheme:light;
}

:root[data-skin="cute"] .top{background:color-mix(in oklab,var(--bg) 92%,transparent)}

/* 打气:聊天气泡 */
#cheerList{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding-bottom:8px}
.ch-day{text-align:center;margin:12px 0 6px}
.ch-day span{font-size:11px;color:var(--muted);background:var(--sunken);padding:2px 10px;border-radius:999px}
.ch-row2{display:flex;align-items:flex-end;gap:8px;margin-top:10px;max-width:100%}
.ch-row2.cont{margin-top:3px}
.ch-row2.me{justify-content:flex-end}
.ch-av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--on-accent);background:var(--g-lower);align-self:flex-start;margin-top:16px}
.ch-row2.cont .ch-av{visibility:hidden;margin-top:0}
.ch-col{display:flex;flex-direction:column;gap:2px;max-width:76%;min-width:0}
.ch-row2.me .ch-col{align-items:flex-end}
.ch-nm{font-size:12px;color:var(--muted);margin-left:4px}
.ch-bub{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;color:var(--ink)}
.ch-row2.me .ch-bub{background:var(--accent);color:var(--on-accent);border-color:transparent;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.ch-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);padding:0 4px}
.ch-meta .ch-del{margin:0;padding:0;font-size:11px}
.ch-compose{position:fixed;left:0;right:0;margin:0 auto;max-width:560px;bottom:calc(52px + env(safe-area-inset-bottom,0px) - 16px);z-index:6;background:var(--bg);padding:8px 16px 24px;border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.06)}
#v-cheer #cheerList{padding-bottom:130px}
.ch-quick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.ch-quick::-webkit-scrollbar{display:none}
.ch-quick .chip{flex:none}
.ch-in{display:flex;gap:8px;align-items:flex-end}
.ch-in textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:22px;padding:10px 14px}
.ch-in .primary{border-radius:22px;flex:none}
/* 聊天列表 */
.cl-row{display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;color:var(--ink);margin-top:10px}
.cl-row .ch-av{margin-top:0;width:42px;height:42px;font-size:17px}
.cl-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cl-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cl-nm{font-weight:700;font-size:15px}
.cl-tm{font-size:11px;color:var(--muted);flex:none}
.cl-pv{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.cl-lock{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 4px}
#v-cheer.chlist .ch-compose{display:none}
.ch-av.grp{background:var(--g-cardio)}
.cl-cnt{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.cl-mem{display:block;margin-top:2px}
.np-tip{font-size:12px;color:var(--muted);margin:2px 0 8px}
.np-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.np-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;color:var(--ink)}

.np-nm{flex:1;font-weight:600}

.np-in{width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.np-go{width:100%;margin-top:12px}
#chatNewBtn{font-size:24px;font-weight:400}
.wup{font-style:normal;font-size:10px;color:var(--good);margin-left:2px;vertical-align:1px}
.hv{justify-self:end;min-width:3.4em;text-align:center;font-family:var(--num);font-size:12px;font-weight:700;padding:2px 6px;border-radius:999px;white-space:nowrap}
.hv.up{color:var(--good);background:color-mix(in oklab,var(--good) 12%,transparent)}
.hv.down{color:var(--bad);background:color-mix(in oklab,var(--bad) 10%,transparent)}

.hv.first{color:var(--muted);font-family:var(--body);font-weight:500;font-size:11px}
.hg{display:grid;grid-template-columns:minmax(4.5em,auto) auto auto 1fr;gap:4px 8px;align-items:center;font-size:13px}
.hg .gp{grid-column:1/-1;font-size:12px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:6px}
.hg .hh{font-size:10px;color:var(--muted);align-self:end;margin-top:8px;line-height:1.6}
.hg .gp1{grid-column:1}

.hg .hn{color:var(--muted);line-height:1.25;max-width:6.5em}

.hg .hw{white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums}
.hg .hu{font-size:11px;color:var(--muted);margin-left:2px}
.hg .hw>.hu:first-child{margin-left:0}

.rule .rv small.auto{margin-left:4px;font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 5px}
.rule{flex-wrap:wrap;row-gap:8px}.rule .rl{flex:1 0 100%}.rule .rs-step{flex:1 1 100%;justify-content:space-between}.rule .rs-step .rv{flex:1;text-align:center}

.add-ex{width:100%;margin:0 0 12px;padding:11px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface);color:var(--accent);font-size:14px;font-weight:700}
.hg .hnote{grid-column:2/-1;font-size:11px;color:var(--muted);margin-top:-2px}
/* 首页:今天的部分用橙色(还没练)和绿色(已练);已安排和休息都是灰色 */

#exList .st-done h2{color:var(--good)}
#exList .st-plan h2,#exList .st-rest h2{color:var(--muted)}

.lp-tip{font-size:12px;color:var(--muted);margin:10px 0 0}
.scol{align-items:stretch}

.cd.on{border-color:transparent;background:radial-gradient(closest-side,var(--surface) 82%,transparent 84%),conic-gradient(var(--accent) calc(var(--p)*360deg),var(--sunken) 0)}

.dot.stretch{background:var(--g-stretch,#9B6BE0)}
.gchip.c-stretch{border-color:color-mix(in oklab,var(--g-stretch,#9B6BE0) 60%,var(--line))}
.ps i.stretch,.ps1.stretch{background:color-mix(in oklab,var(--g-stretch,#9B6BE0) 34%,var(--surface))}

<script>
/* 基础部位(8 个)+ 用户自定义合并:同一组的基础部位在首页等处当成一个部位 */
const BASES=["胸","肩","背","手臂","核心","臀","腿","有氧","拉伸"];
const BASE_C={胸:"upper",肩:"upper",背:"upper",手臂:"upper",核心:"core",臀:"lower",腿:"lower",有氧:"cardio",拉伸:"stretch"};
const DEF_GROUPS=[["胸","肩"],["背","手臂"],["臀","腿"],["核心"],["有氧"],["拉伸"]];
/* GROUPS:8 个基础部位,统计/历史/设置都用它;HG:用户合并后的组,只在首页判断要练/休息时用 */
const GROUPS=BASES.map(b=>({k:b,c:BASE_C[b],bases:[b]}));const HG=[];let NEWP=[];
function normGroups(gs){const seen=new Set(),out=[];(gs||[]).forEach(a=>{const b=(a||[]).filter(x=>BASES.includes(x)&&!seen.has(x));b.forEach(x=>seen.add(x));if(b.length)out.push(b.sort((x,y)=>BASES.indexOf(x)-BASES.indexOf(y)))});
  BASES.forEach(x=>{if(!seen.has(x))out.push([x])});return out.sort((a,b)=>BASES.indexOf(a[0])-BASES.indexOf(b[0]))}
function groupsFromAssign(a){const m={};BASES.forEach(b=>{const k=a&&a[b]!=null?String(a[b]):"s_"+b;(m[k]=m[k]||[]).push(b)});return normGroups(Object.values(m))}
function assignFromGroups(gs){const a={};normGroups(gs).forEach((g,i)=>g.forEach(b=>a[b]=i));return a}
function applyGroups(gs){const n=normGroups(gs);HG.splice(0,HG.length,...n.map(a=>({k:a.join(""),c:BASE_C[a[0]],bases:a})));NEWP=HG.map(g=>g.k);if(typeof rebuildLib==="function"&&typeof LIB!=="undefined")rebuildLib()}
function groupOfBase(b){const g=HG.find(g=>g.bases.includes(b));return g?g.k:b}
const CORE_IDS=["plank","side_plank","ab_crunch","cable_crunch","leg_raise","russian_twist","torso_rot","ab_wheel","dead_bug"];
/* 复合动作:一次调动大面积肌群,建议先练 */
const COMPOUND_IDS=new Set(["bench_press","db_press","chest_press","incline_press","push_up","shoulder_press","db_shoulder_press","pull_up","assisted_pullup","lat_pulldown","seated_row","bb_row","db_row","dips","hip_thrust","rdl","bulgarian","squat","smith_squat","hack_squat","leg_press","lunge","deadlift"]);
function isCompound(ex){return COMPOUND_IDS.has(ex.id)||(!!ex.custom&&/深蹲|硬拉|卧推|臀推|划船|引体|推举|腿举|箭步|分腿蹲/.test(ex.name||""))?1:0}
/* 新用户引导:第一次进来弹窗选动作 */
const OB_REC=["chest_press","pec_fly","shoulder_press","lateral_raise","lat_pulldown","seated_row","bicep_curl","tricep_pushdown","hip_thrust","squat","leg_press","leg_curl","plank","ab_crunch","treadmill"];
function obOpen(){S.ob={sel:[],unit:"磅",step:1};$("ob").hidden=false;renderOb()}
function renderOb(){const o=S.ob;if(!o)return;let h;
  if(o.step===2){const sk=!o.n;
    const F=[["👆","长按首页的部位","安排它从哪天开始练,比如把「腿」挪到明天。"],["⚙️","设置里自己定规则","新增自定义动作,决定每个部位练完要休息几天。"],["📈","「进步」看变化","最大重量、训练容量、次数的曲线,还有每个部位的周环比。"],["🏋️","「一起练」","和朋友互发今天要练的动作,实时看彼此的进度。"]];
    h='<div class="ob-done"><div class="ob-big">'+(sk?'👋':'🎉')+'</div><h2 id="obTitle">'+(sk?'没问题,稍后再选':'设置好了!')+'</h2>'
     +'<p>'+(sk?'随时在首页点「选择动作」,或去 <b>「设置 → 训练动作」</b> 添加。':'已添加 '+o.n+' 个动作,首页会按部位告诉你今天该练什么。以后想增减,去 <b>「设置 → 训练动作」</b> 修改。')+'</p>'
     +'<div class="ob-feat"><div class="ob-ft">这些功能可以帮你练得更好</div>'+F.map(([i,t,d])=>'<div class="ob-f"><span class="ob-fi">'+i+'</span><span><b>'+t+'</b><small>'+d+'</small></span></div>').join("")+'</div>'
     +'<button class="primary ob-go" data-act="obClose">'+(sk?'知道了':'开始训练')+'</button></div>';
    $("obBody").innerHTML=h;$("obBody").scrollTop=0;return}
  const items=libItems(),by={};items.forEach(it=>{const b=BASE_BY_ID[it.id]||it.part;(by[b]=by[b]||[]).push(it)});
  h='<div class="mm-h"><b id="obTitle">欢迎!先选你常练的动作</b></div><p class="ob-p">点一下选中,再点取消。不确定的话,用下面的「常用推荐」一键选上。</p>'
   +'<div class="ob-tools"><button class="chip" data-act="obRec">✨ 常用推荐</button>'+(o.sel.length?'<button class="chip" data-act="obClear">清空</button>':'')+'<span class="ob-unit">重量单位 '+["磅","公斤"].map(u=>'<button class="chip" data-act="obUnit" data-v="'+u+'" aria-pressed="'+(o.unit===u)+'">'+u+'</button>').join("")+'</span></div>'
   +'<div class="ob-list">'+BASES.filter(b=>by[b]).map(b=>'<div class="ob-g"><div class="ob-gn"><i class="dot '+(BASE_C[b]||"upper")+'"></i>'+esc(b)+'<small>'+by[b].filter(it=>o.sel.includes(it.id)).length+'/'+by[b].length+'</small></div><div class="chips">'+by[b].map(it=>'<button class="chip ob-x" data-act="obPick" data-id="'+esc(it.id)+'" aria-pressed="'+o.sel.includes(it.id)+'">'+esc(it.name)+'</button>').join("")+'</div></div>').join("")+'</div>'
   +'<div class="ob-foot"><button class="ghost" data-act="obSkip">稍后再选</button><button class="primary" data-act="obSave"'+(o.sel.length?'':' disabled')+'>'+(o.saving?'保存中…':'完成'+(o.sel.length?'('+o.sel.length+')':''))+'</button></div>';
  const sc=$("obBody").querySelector(".ob-list"),top=sc?sc.scrollTop:0;$("obBody").innerHTML=h;const sc2=$("obBody").querySelector(".ob-list");if(sc2)sc2.scrollTop=top}
async function obSave(){const o=S.ob;if(!o||!o.sel.length||o.saving)return;o.saving=true;renderOb();
  const lib=libItems(),list=o.sel.map(id=>{const it=clone(lib.find(e=>e.id===id));if(it.kind!=="cardio"&&it.kind!=="time"&&!(it.variants||[]).includes("自重"))it.units={[(it.variants||[])[0]||""]:o.unit};return it});
  S.catDraft=list;await saveDraft();o.saving=false;
  if(S.saveMsg&&!S.saveMsg.ok){renderOb();return}
  S.saveMsg=null;o.step=2;o.n=list.length;renderOb();render()}
const GLUTE_IDS=["hip_thrust","glute_bridge","glute_kick","cable_kickback","hip_abd","single_leg_ext","rotary_hip"];
const BASE_BY_ID={};
function isCore(e){return e.part==="核心"||e.group==="核心"||CORE_IDS.includes(e.id)||/卷腹|平板|举腿|转体|健腹|死虫|腹肌/.test(e.name||"")}
function isTri(e){return ["tricep_pushdown","overhead_ext","tricep_ext","dips"].includes(e.id)||/三头|下压|臂屈伸|双杠/.test(e.name||"")}
function baseOf(e){if(e.base&&BASES.includes(e.base))return e.base;if(BASE_BY_ID[e.id])return BASE_BY_ID[e.id];
  const P=e.part||"",G=e.group||"",n=e.name||"";
  if(e.kind==="cardio"||P==="有氧")return "有氧";if(P==="拉伸"||G==="拉伸")return "拉伸";if(isCore(e))return "核心";
  if(BASES.includes(P))return P;if(P==="大腿"||P==="小腿")return "腿";
  if(/臀|髋外展|后踢/.test(n))return "臀";if(G==="臀腿"||P==="臀腿"||/腿|蹲|硬拉|提踵|髋内收/.test(n))return "腿";
  if(isTri(e)||/弯举|二头|三头/.test(n))return "手臂";
  if(/肩|推举|平举|飞鸟|面拉/.test(n))return "肩";if(/背|划船|下拉|引体/.test(n))return "背";
  if(/胸|卧推|夹胸|俯卧撑/.test(n)||P.includes("胸"))return "胸";return "背"}
function partOf(e){return groupOfBase(baseOf(e))}
const UNITS=["磅","公斤","刻度"];
const WD=["周日","周一","周二","周三","周四","周五","周六"];
const DEFAULT_CATALOG=[
 {id:"chest_press",name:"坐姿推胸",group:"上肢",part:"胸"},
 {id:"pec_fly",name:"蝴蝶机夹胸",group:"上肢",part:"胸"},
 {id:"lateral_raise",name:"侧平举",group:"上肢",part:"肩",variants:["机器","哑铃"]},
 {id:"shoulder_press",name:"肩推",group:"上肢",part:"肩"},
 {id:"rear_fly",name:"反向飞鸟",group:"上肢",part:"肩"},
 {id:"seated_row",name:"坐姿划船",group:"上肢",part:"背"},
 {id:"lat_pulldown",name:"高位下拉",group:"上肢",part:"背"},
 {id:"pull_up",name:"引体向上",group:"上肢",part:"背"},
 {id:"tricep_pushdown",name:"绳索下压",group:"上肢",part:"手臂"},
 {id:"bicep_curl",name:"二头弯举",group:"上肢",part:"手臂",variants:["杠铃","哑铃","机器"]},
 {id:"overhead_ext",name:"哑铃颈后臂屈伸",group:"上肢",part:"手臂"},
 {id:"leg_press",name:"腿举机",group:"臀腿",part:"大腿"},
 {id:"leg_curl",name:"腿弯举",group:"臀腿",part:"大腿"},
 {id:"leg_ext",name:"坐姿屈伸",group:"臀腿",part:"大腿"},
 {id:"hip_add",name:"髋内收",group:"臀腿",part:"大腿"},
 {id:"glute_kick",name:"后踢机",group:"臀腿",part:"臀"},
 {id:"hip_abd",name:"髋外展",group:"臀腿",part:"臀"},
 {id:"calf_raise",name:"提踵",group:"臀腿",part:"小腿"},
 {id:"plank",name:"平板支撑",group:"核心",part:"核心",kind:"time"},
 {id:"ab_crunch",name:"卷腹机",group:"核心",part:"核心",variants:["自重"]},
 {id:"torso_rot",name:"躯干旋转",group:"核心",part:"核心"}
];

const S={fold:{mine:false,add:true},theme:"auto",db:null,days:{},pending:{},queue:{},inflight:{},catalog:null,loaded:false,
  tab:"train",date:todayStr(),group:"胸肩",onlyTodo:false,draft:null,sheetMode:null,
  progEx:null,progSeries:null,progMetric:"top",dates:null};

/* ---------- 小工具 ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function pad(n){return String(n).padStart(2,"0")}
function fmtD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayStr(){return fmtD(new Date())}
function toDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function shift(s,n){const d=toDate(s);d.setDate(d.getDate()+n);return fmtD(d)}
function ts(s){const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}
function gap(a,b){return Math.round((ts(b)-ts(a))/864e5)}
function md(s){return s.slice(5).replace("-","/")}
function ago(s){const n=gap(s,todayStr());return n===0?"今天":n===1?"昨天":n===2?"前天":n>0?n+" 天前":md(s)}
function wText(ex,e){if(ex.kind==="cardio"){const m=cardioMin(e);return {t:m?nf(m):"–",u:"分钟"}}if(ex.kind==="time")return {t:"",u:"秒"};const ws=[...new Set((e.sets||[]).map(s=>s.w).filter(w=>w!=null))];
  if(!ws.length)return {t:"–",u:""};if(ws.every(w=>w===0))return {t:"空载",u:""};
  return {t:ws.length>1?nf(Math.min(...ws))+"～"+nf(Math.max(...ws)):nf(ws[0]),u:unitOf(ex,e)}}
function weekStart(s){const d=toDate(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return fmtD(d)}
function num(v){if(v==null)return null;const t=String(v).replace(/[,，]/g,".").trim();if(t==="")return null;const n=parseFloat(t);return isFinite(n)?n:null}
function nf(n){return n==null?"":String(Math.round(n*100)/100)}

function catalog(){const c=S.catalog||(S.db?[]:DEFAULT_CATALOG);c.forEach(e=>{if(e.id==="hike"&&(e.name!=="徒步"||(e.fields||[]).length!==1)){e.name="徒步";e.fields=["t"]} /* 徒步只记时长 */if(e.id==="dead_bug"&&e.kind==="time"){delete e.kind;if(!e.variants||!e.variants.length)e.variants=["自重"]} /* 死虫式改成按次数 */if(!e.base)e.base=baseOf(e);e.part=e.base;e.group=e.base}); // 统计用基础部位;首页再按合并分组
 const ab=c.find(e=>e.id==="ab_crunch");if(ab&&!(ab.variants||[]).includes("自重"))ab.variants=[...(ab.variants||[]),"自重"];return c}
const isBW=v=>v==="自重";
function exById(id){return catalog().find(e=>e.id===id)}
function day(d){return S.pending[d]||S.days[d]||null}
function allDates(){ if(!S.dates){const set=new Set([...Object.keys(S.days),...Object.keys(S.pending)]);S.dates=[...set].filter(d=>day(d)).sort()} return S.dates }
function sessions(exId){const out=[];for(const d of allDates()){const e=day(d).entries&&day(d).entries[exId];if(e)out.push({date:d,e})}return out}
/* 有氧:每次记录可以有好几段,每段的字段由动作决定(跑步机:时间/速度/坡度…) */
const CF={t:{l:"时间",u:"分钟"},spd:{l:"速度",u:""},inc:{l:"坡度",u:"%"},lvl:{l:"档位",u:""},res:{l:"阻力",u:""},dist:{l:"距离",u:"km"},distm:{l:"距离",u:"米"},floors:{l:"层数",u:"层"},elev:{l:"爬升",u:"米"},cnt:{l:"个数",u:"个"}};
function cardioFields(ex){return ex.fields&&ex.fields.length?ex.fields:["t"]}
function cardioMin(e){return (e.sets||[]).reduce((a,s)=>a+(s.t||0),0)}
function segText(ex,s){return cardioFields(ex).filter(f=>s[f]!=null).map(f=>f==="t"?nf(s.t)+"分钟":CF[f].l+" "+nf(s[f])+CF[f].u).join(" · ")}
function cardioText(ex,e){return (e.sets||[]).map(s=>segText(ex,s)).filter(Boolean).join(" / ")||(e.note||"")}
function cardioBrief(ex,e){const s=(e.sets||[])[0]||{};return cardioFields(ex).filter(f=>f!=="t"&&s[f]!=null).map(f=>CF[f].l+nf(s[f])+CF[f].u).join(" ")+((e.sets||[]).length>1?" 等"+e.sets.length+"段":"")}
function unitOf(ex,e){if(ex.kind==="cardio")return "分钟";return ex.kind==="time"?"秒":(e.unit||(ex.units&&ex.units[e.variant||""])||"")}
function sKey(ex,e){return (e.variant||"")+"|"+unitOf(ex,e)}
/* 助力类动作(引体向上用的是助力配重):重量越小越强,对比时反过来算 */
function isAssist(ex){return !!ex&&(ex.id==="pull_up"||ex.id==="assisted_pullup"||/辅助|助力|assist/i.test(ex.name||""))}
/* 递减组:一组里有好几段重量(比如 12 磅→7 磅→4 磅),每段各自的次数。存成 {w,r,d:[{w,r},…]} */
function segs(sets){const o=[];(sets||[]).forEach(s=>{o.push(s);(s.d||[]).forEach(x=>o.push(x))});return o}
function repsOf(s){return (s.r||0)+(s.d||[]).reduce((a,x)=>a+(x.r||0),0)}
function metric(ex,e){const sets=e.sets||[];
  if(ex.kind==="cardio"){const m=cardioMin(e);return {top:m||null,vol:m,reps:0,n:sets.length}}
  if(ex.kind==="time"){const rs=sets.map(s=>s.r).filter(r=>r!=null);return {top:rs.length?Math.max(...rs):null,vol:rs.reduce((a,b)=>a+b,0),reps:rs.reduce((a,b)=>a+b,0),n:sets.length}}
  const ws=sets.map(s=>s.w).filter(w=>w!=null);
  const sg=segs(sets);return {top:ws.length?(isAssist(ex)?Math.min(...ws):Math.max(...ws)):null,vol:sg.reduce((a,s)=>a+(s.w||0)*(s.r||0),0),reps:sg.reduce((a,s)=>a+(s.r||0),0),n:sets.length}}
function repsStr(sets){if(sets.every(s=>s.r==null))return "";
  return sets.map(s=>(s.r==null?"–":s.r)+((s.d||[]).length?"+"+s.d.map(x=>x.r==null?"–":x.r).join("+"):"")+(s.f?"力竭":"")).join("/")}
/* 每组次数固定按 4 列显示,多于 4 组时换行 */
function cells(sets){const n=Math.max(4,sets.length);let h='<span class="rs">';
  for(let i=0;i<n;i++){const s=sets[i],has=s&&s.r!=null,dp=s&&(s.d||[]).length;h+='<i class="'+(has?"":"z")+(s&&s.f?" f":"")+(dp?" dp":"")+'"'+(dp?' title="递减组 '+esc(repsStr([s]))+'"':s&&s.f?' title="力竭"':'')+'>'+(has?nf(dp?repsOf(s):s.r):"·")+'</i>'}
  return h+'</span>'}
function fmtEntry(ex,e,html){const sets=e.sets||[],u=unitOf(ex,e),time=ex.kind==="time";
  if(ex.kind==="cardio"){const t=cardioText(ex,e);return html?'<span class="en"><span class="nr cdt">'+esc(t)+'</span></span>':t}
  if(!sets.length)return e.note?esc(e.note):"";
  let head="";
  if(!time){const ws=[...new Set(segs(sets).map(s=>s.w).filter(w=>w!=null))];
    if(!ws.length&&isBW(e.variant))head="自重";
    if(ws.length){const zero=ws.every(w=>w===0);const t=zero?"空载":ws.length>1?nf(Math.min(...ws))+"～"+nf(Math.max(...ws)):nf(ws[0]);
      head=(html&&!zero?'<span class="num">'+t+'</span>':t)+(!zero&&u?" "+esc(u):"")}}
  const hasR=sets.some(s=>s.r!=null);
  if(html)return '<span class="en">'+'<span class="wt'+(time?' wt-t':'')+'">'+(time?'计时 · 秒':head)+'</span>'+(hasR?cells(sets):'<span class="nr">未记次数</span>')+'</span>';
  return [head,hasR?repsStr(sets)+(time?" 秒":""):"未记次数"].filter(Boolean).join(" · ")}
function lastBefore(exId,date,variant){const ss=sessions(exId).filter(s=>s.date<date&&(variant===undefined||(s.e.variant||"")===variant));return ss.length?ss[ss.length-1]:null}
function isPR(ex,date){const e=day(date)&&day(date).entries&&day(date).entries[ex.id];if(!e)return false;const k=sKey(ex,e),top=metric(ex,e).top;if(top==null)return false;
  const prev=sessions(ex.id).filter(s=>s.date<date&&sKey(ex,s.e)===k).map(s=>metric(ex,s.e).top).filter(v=>v!=null);
  return prev.length>0&&(isAssist(ex)?top<Math.min(...prev):top>Math.max(...prev))}

/* ---------- 云端读写 ---------- */
function setSync(t,err){if(S.sandbox){t="测试模式";err=true}const el=$("sync");const ok=!err&&/^已(同步|保存)/.test(t);el.textContent=ok?"✓":t;el.title=t;el.setAttribute("aria-label",t);el.classList.toggle("err",!!err);el.classList.toggle("ok",ok)}
async function writeDay(date,data){const ref=S.db.collection(S.base+"/train/days").doc(date);const empty=!data||(!Object.keys(data.entries||{}).length&&!data.note);
  const go=()=>empty?ref.delete():ref.set(data);
  try{await go()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));await go()}else throw e}}
function saveDay(obj){S.pending[obj.date]=obj;S.dates=null;S.queue[obj.date]=obj;savePend();pump(obj.date);render();if(obj.date===todayStr()&&typeof syncPlans==="function")syncPlans()}
/* ---------- 离线:本机缓存 + 待同步队列 ---------- */
// 云端的数据在这台手机上留一份,打开时先显示;没网时记的训练先存在手机里,有网后自动补传
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){if(S.sandbox)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* 新用户测试模式:不连云端、不读写本机记录,刷新前一直有效,点「退出测试」回到自己的账号 */
function sbOn(){try{return localStorage.getItem("tl_sandbox")==="1"}catch(e){return false}}
function sbEnter(){try{localStorage.setItem("tl_sandbox","1")}catch(e){}location.reload()}
function sbExit(){try{localStorage.removeItem("tl_sandbox")}catch(e){}location.reload()}
function pendKey(){return "tl_pend_"+(S.uid||S.cacheUid||"")}
function savePend(){if(!(S.uid||S.cacheUid))return;lsSet(pendKey(),S.pending)}
let cacheT=null;
function saveCache(){if(!S.uid)return;clearTimeout(cacheT);cacheT=setTimeout(()=>{lsSet("tl_cache_"+S.uid,{days:S.days,catalog:S.catalog,rules:S.rules||{},grp:S.grpSaved||null,at:Date.now()});lsSet("tl_lastuid",S.uid)},800)}
function loadCache(){const uid=lsGet("tl_lastuid");if(!uid)return false;const c=lsGet("tl_cache_"+uid);S.cacheUid=uid;
  const pend=lsGet("tl_pend_"+uid)||{};Object.keys(pend).forEach(d=>{if(pend[d]&&pend[d].date){S.pending[d]=pend[d];S.queue[d]=pend[d]}});
  if(!c)return Object.keys(S.pending).length>0;
  S.days=c.days||{};S.dates=null;S.loaded=true;if(Array.isArray(c.catalog)){S.catalog=clone(c.catalog);S.catReady=true}
  S.rules=c.rules||{};if(c.grp){S.grpSaved=c.grp;applyGroups(groupsFromAssign(c.grp))}S.fromCache=true;return true}
function pendCount(){return Object.keys(S.pending).length}
function flushAll(){if(!S.db)return;Object.keys(S.queue).forEach(d=>pump(d))}
addEventListener("online",()=>{if(S.db)flushAll();else if(S.offline){if($("sheet").hidden)location.reload();else S.reloadOnClose=true}});
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error("timeout"),{code:"timeout"})),ms))]);
async function pump(date){ if(!S.db){setSync("离线 · 已存在手机里,联网后自动同步");return}
  if(S.inflight[date])return;S.inflight[date]=true;setSync("保存中…");
  try{while(S.queue[date]!==undefined){const data=S.queue[date];delete S.queue[date];try{await withTimeout(writeDay(date,data),15000)}catch(e){if(S.queue[date]===undefined)S.queue[date]=data;throw e}
      if(S.queue[date]===undefined){const empty=!Object.keys(data.entries||{}).length&&!data.note;if(empty)delete S.days[date];else S.days[date]=data;delete S.pending[date];S.dates=null;savePend();saveCache()}}
    setSync(pendCount()?"还有 "+pendCount()+" 天的记录待同步":"已保存到云端")}
  catch(e){const q=e&&e.code==="quota_exceeded";setSync(q?"云端空间已满,保存失败":"网络不好 · 已存在手机里,稍后自动重试",q);
    if(!q){clearTimeout(S.retryT&&S.retryT[date]);S.retryT=S.retryT||{};S.retryT[date]=setTimeout(()=>pump(date),15000)}}
  finally{S.inflight[date]=false}}
let catChain=Promise.resolve();
function saveCatalog(list){S.catalog=list;render();if(!S.db)return;const body={list:clone(list)};S.catW=(S.catW||0)+1;
  catChain=catChain.then(()=>S.db.doc(S.base+"/catalog").set(body)).then(()=>setSync("已保存到云端"),()=>setSync("动作列表保存失败",true)).finally(()=>{S.catW--;S.catAt=Date.now()})}

/* 第一次打开时,如果有人提前为这个账号准备了动作和历史记录(imports/<邮箱>),就搬进自己的私有空间 */
async function importPending(db,usr){let email="";try{email=((await usr.me()).email||"").toLowerCase()}catch(e){}
  let ref=null,snap=null;
  if(email){ref=db.doc("imports/"+email);snap=await ref.get();if(!snap.exists)snap=null}
  if(!snap){let owner=true;try{owner=await usr.isOwner()}catch(e){}
    if(!owner){const q=await db.collection("imports").limit(2).get();if(q.docs.length===1){snap=q.docs[0];ref=db.doc("imports/"+snap.id)}}}
  if(!snap)return;const v=snap.data()||{};setSync("正在导入你的记录…");
  const days=v.days||{};for(const d of Object.keys(days))await db.collection(S.base+"/train/days").doc(d).set(days[d]);
  if(Array.isArray(v.catalog))await db.doc(S.base+"/catalog").set({list:v.catalog});
  try{await ref.delete()}catch(e){}}
async function boot(){ if(sbOn()){S.sandbox=true;S.skin="default";applySkin();S.db=null;S.catalog=[];S.catReady=true;S.loaded=true;S.days={};S.dates=null;S.plan={};
    const b=$("banner");b.hidden=false;b.classList.add("sb-banner");b.innerHTML='🧪 新用户测试模式 · 这里的操作不会保存,也不影响你的真实记录<button class="tbtn" data-act="sbExit" style="margin-left:6px">退出测试</button>';setSync("测试模式",true);render();return}
  S.lastEx=lsGet("tl_lastex");S.lpTip=!!lsGet("tl_lptip");{const u=lsGet("tl_lastuid");if(u)S.plan=lsGet("tl_plan_"+u)||{}}const hadCache=loadCache();render();
  if(hadCache)setSync(pendCount()?"本机记录 · "+pendCount()+" 天待同步":"正在连接云端…");
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  S.db=db;
  let uid=null,usr=null;if(db){try{usr=await window.claude.use("user");uid=usr?await usr.id():null}catch(e){uid=null}}
  if(!db||!uid){S.db=null;S.offline=true;const b=$("banner");b.hidden=false;
    if(hadCache){setSync("离线",true);b.innerHTML='现在没连上网,显示的是这台手机上保存的记录。离线时记的训练会先存在手机里,联网后自动同步。<button class="tbtn" data-act="reconnect" style="margin-left:6px">重新连接</button>'}
    else{setSync("未连接云端",true);b.innerHTML='现在连不上云端,这台手机上也还没有保存过记录。请联网后重新打开。<button class="tbtn" data-act="reconnect" style="margin-left:6px">重新连接</button>'}
    render();return}
  // 换了账号:丢掉别人的本机缓存
  if(S.cacheUid&&S.cacheUid!==uid){S.days={};S.dates=null;S.catalog=null;S.catReady=false;S.loaded=false;S.pending={};S.queue={};S.rules={};S.grpSaved=null;applyGroups(DEF_GROUPS);render()}
  // 每个人的记录和动作列表都存在自己的私有空间里,互相看不到
  S.prevUid=S.cacheUid;S.base="data/users/"+uid;S.uid=uid;S.usr=usr;S.cacheUid=uid;lsSet("tl_lastuid",uid);
  // 上次没网时存在手机里的记录,现在补传
  setTimeout(flushAll,0);
  // 打气留言板:所有人共享,按时间倒序
  db.collection("cheers").orderBy("t","desc").limit(200).onSnapshot(snap=>{S.cheers=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.tab==="cheer"){renderCheer();markSeen()}updDot();runMigrate()},()=>{});
  // 打气已读位置存在自己的私有空间,手机和电脑同步
  db.doc(S.base+"/ui").onSnapshot(sn=>{const v=sn.exists?sn.data():null;if(v&&v.skin&&v.skin!==S.skin){S.skin=v.skin;applySkin();try{localStorage.setItem("tl_skin",v.skin)}catch(e){}render()}
    else if(!(v&&v.skin)){ /* 云端没存过主题:同一账号沿用本机的;新账号一律用默认主题 */
      if(S.prevUid===uid&&S.skin&&S.skin!=="default")db.doc(S.base+"/ui").set({skin:S.skin}).catch(()=>{});
      else if(S.skin&&S.skin!=="default"){S.skin="default";applySkin();try{localStorage.setItem("tl_skin","default")}catch(e){}render()}}},()=>{});
  S.plan=lsGet("tl_plan_"+uid)||{};
  // 安排:每个部位一个文档(plan/g/<id>),互不覆盖;本机刚改过的以本机为准,直到云端对上
  db.collection(S.base+"/plan/g").limit(100).onSnapshot(sp=>{const m={};sp.docs.forEach(x=>{const v=x.data();if(v&&v.k&&v.d)m[v.k]=v.d});S.plan=m;
    Object.keys(S.planOv).forEach(k=>{const o=S.planOv[k];if((m[k]||null)===(o.d||null)&&Date.now()-o.t>15000)delete S.planOv[k]});lsSet("tl_plan_"+uid,planAll());render();
    if(!sp.docs.length&&!S.planMig){S.planMig=true;db.doc(S.base+"/plan").get().then(o=>{const old=o.exists&&o.data()&&o.data().byGroup;if(old&&Object.keys(old).length){Object.keys(old).forEach(k=>{if(!(k in S.planOv))setPlan(k,old[k],true)})}}).catch(()=>{})}},()=>{});
  db.doc(S.base+"/rules").onSnapshot(sn=>{const v=sn.exists?sn.data():null;const r=(v&&v.restDays)||{};S.rules={};Object.keys(r).forEach(k=>S.rules[k.replace(/·/g,"")]=r[k]);S.tgt=(v&&v.target)||{};saveCache();render()},()=>{});
  db.doc(S.base+"/groups").onSnapshot(sn=>{const v=sn.exists?sn.data():null;S.grpSaved=v&&v.assign?v.assign:null;applyGroups(S.grpSaved?groupsFromAssign(S.grpSaved):DEF_GROUPS);saveCache();render()},()=>{});
  db.doc(S.base+"/prefs").onSnapshot(sn=>{const v=sn.exists?sn.data():null;S.seen=Math.max(S.seen||0,(v&&v.cheerSeen)||0);const cs=(v&&v.chatSeen)||{};Object.keys(cs).forEach(k=>S.chatSeen[k]=Math.max(S.chatSeen[k]||0,cs[k]||0));S.seenReady=true;if(S.tab==="cheer")markSeen();updDot()},()=>{});
  initChat(db).catch(e=>{S.chatErr="加密聊天初始化失败,请刷新重试。";if(S.tab==="cheer")renderCheer()});
  try{const c=await db.doc(S.base+"/catalog").get();if(!c.exists)await importPending(db,usr)}catch(e){}
  db.collection(S.base+"/train/days").orderBy("date","desc").limit(1000).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.date)m[v.date]=v});S.days=m;S.dates=null;S.loaded=true;S.fromCache=false;maybeMigrate();saveCache();
    if(!Object.keys(S.inflight).some(k=>S.inflight[k]))setSync(pendCount()?"还有 "+pendCount()+" 天的记录待同步":"已同步");render()},
    e=>{console.error("days listener",e);setSync("云端连接中断,请刷新页面"+(e&&e.code?"("+e.code+")":""),true)});
  db.doc(S.base+"/catalog").onSnapshot(s=>{if(S.catW>0)return; /* 本机正在保存动作列表时,不被旧数据盖回去 */const v=s.exists?s.data():null;S.catalog=v&&Array.isArray(v.list)?clone(v.list):null;S.catReady=true;maybeMigrate();saveCache();render()},()=>{S.catReady=true;render()});
}

/* 手机返回手势:每进一层就在浏览器历史里记一步,返回时退一层,首页再返回才离开页面 */
let H=0,hSkip=false;
function depth(){let d=0;if(S.tab==="train"){if(S.part)d=1}else{d=1;if(S.tab==="prog"&&(S.progEx||S.progPart))d=2}if(!$("sheet").hidden)d++;return d}
function syncHist(){const want=depth();try{while(H<want){history.pushState({tl:H+1},"");H++}
  if(H>want){const n=H-want;H=want;hSkip=true;setTimeout(()=>{hSkip=false},1500);history.go(-n)}}catch(e){}}
window.addEventListener("popstate",()=>{if(hSkip){hSkip=false;return}if(H<=0)return;H--;
  if(!$("sheet").hidden)closeSheet(false);
  else if(S.tab==="prog"&&(S.progEx||S.progPart)){S.progEx=null;S.progPart=null;render()}
  else if(S.part){S.part=null;render()}
  else if(S.tab!=="train"){S.tab="train";render()}});

function renderTrain(){

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

  const dots=pts.map(p=>'<circle cx="'+X(p).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>').join("");

/* ---------- 进步页顶部:今天 vs 上次,逐组对比 ---------- */
const LB2KG=0.45359237;
function convW(w,from,to){if(w==null||from===to)return w;if(from==="磅"&&to==="公斤")return w*LB2KG;if(from==="公斤"&&to==="磅")return w/LB2KG;return undefined}
function todayCmp(){const t=todayStr(),en=(day(t)||{}).entries||{},cat=catalog();
  const rows=[];let n=0,vUp=0,wUp=0;
  const volOf=(ex,e,u)=>{if(ex.kind==="cardio")return cardioMin(e);if(isAssist(ex))return segs(e.sets).reduce((a,s)=>a+(s.r||0),0);const time=ex.kind==="time",eu=unitOf(ex,e);let ok=true;
    const v=segs(e.sets).reduce((a,s)=>{if(time||s.w==null)return a+(s.r||0);const w=convW(s.w,eu,u);if(w===undefined){ok=false;return a}return a+w*(s.r||0)},0);return ok?v:null};
  const topOf=(ex,e,u)=>{if(ex.kind==="time"||ex.kind==="cardio")return null;const eu=unitOf(ex,e);const ws=(e.sets||[]).map(s=>s.w).filter(w=>w!=null).map(w=>convW(w,eu,u)).filter(w=>w!=null);return ws.length?(isAssist(ex)?Math.min(...ws):Math.max(...ws)):null};
  cat.forEach(ex=>{const e=en[ex.id];if(!e||!(e.sets||[]).length)return;
    const last=lastBefore(ex.id,t,e.variant||"");const u=unitOf(ex,e);
    if(!last||!(last.e.sets||[]).length){rows.push({ex,e,first:true});return}
    const v=volOf(ex,e,u),pv=volOf(ex,last.e,u),w=topOf(ex,e,u),pw=topOf(ex,last.e,u);
    const as=isAssist(ex),wd=w!=null&&pw!=null?(as?pw-w:w-pw):0,vu=as?(wd>1e-9||(Math.abs(wd)<1e-9&&v!=null&&pv!=null&&v>pv)):(v!=null&&pv!=null&&v>pv+1e-9),wu=wd>1e-9;n++;if(vu)vUp++;if(wu)wUp++;
    rows.push({ex,e,last,u,v,pv,w,pw,vu,wu,as,wd,time:ex.kind==="time",cd:ex.kind==="cardio",bw:ex.kind!=="time"&&ex.kind!=="cardio"&&w==null})});
  const vn=x=>nf(Math.round(x));
  rows.forEach(r=>{r.st=r.first?"new":r.vu?"up":(r.as&&r.wd<-1e-9)?"down":(r.v!=null&&r.pv!=null&&r.v<r.pv-1e-9&&!(r.as&&r.wd>1e-9))?"down":"same"});
  const dn=rows.filter(r=>r.st==="down").length;
  let h='<div class="cmp"><div class="cmp-h"><b>今天 vs 上次</b><small>每个动作和它的上一次比</small></div>';
  if(!rows.length)return h+'<div class="cmp-empty">今天还没有训练记录。练完回来看看哪些动作有进步。</div></div>';
  h+='<div class="cmp-sum"><span class="k up"><i class="num">'+rows.filter(r=>r.st==="up").length+'</i>进步</span><span class="k same"><i class="num">'+rows.filter(r=>r.st==="same").length+'</i>持平</span><span class="k down"><i class="num">'+dn+'</i>退步</span>'
   +(wUp?'<span class="k w"><i class="num">'+wUp+'</i>重量突破</span>':'')+'</div>';
  const tile=r=>{let big,sub;
    if(r.st==="new"){big='首次';sub='下次开始对比'}
    else if(r.as&&Math.abs(r.wd)>1e-9){big=r.wd>0?'助力↓':'助力↑';sub='助力 '+nf(r.pw)+' → '+nf(r.w)}
    else if(r.v==null||r.pv==null){big='—';sub='单位不同'}
    else{const pct=r.pv>0?Math.round((r.v-r.pv)/r.pv*100):null;big=r.st==="same"||pct===0?'持平':(pct==null?'↑':(pct>0?'+':'')+pct+'%');
