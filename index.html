/* 历史里每个动作和它上一次(同器械、同单位)比:重量有没有突破,训练容量涨了还是跌了 */
function histW(ex,e){const sets=e.sets||[],u=unitOf(ex,e),ws=[...new Set(segs(sets).map(s=>s.w).filter(w=>w!=null))];
  if(!ws.length)return isBW(e.variant)?'<span class="hu">自重</span>':'<span class="hu">—</span>';
  if(ws.every(w=>w===0))return '<span class="hu">空载</span>';
  return '<span class="num">'+(ws.length>1?nf(Math.min(...ws))+'～'+nf(Math.max(...ws)):nf(ws[0]))+'</span>'+(u?'<span class="hu">'+esc(u)+'</span>':'')}
function histCmp(ex,e,d){const vv=e.variant||"",prev=sessions(ex.id).filter(s=>s.date<d&&(s.e.variant||"")===vv).pop();
  if(!prev)return{wUp:false,cls:"first",txt:"首次"};
  const as=isAssist(ex),strength=ex.kind!=="time"&&ex.kind!=="cardio";
  // 单位:没记单位的当作同一单位;磅和公斤之间换算;其他单位不同就不比
  const ue=unitOf(ex,e),up=unitOf(ex,prev.e);let cv=w=>w;
  if(strength&&ue&&up&&ue!==up){if(convW(1,up,ue)===undefined)return{wUp:false,cls:"same",txt:"–",tip:"单位不同"};cv=w=>w==null?w:convW(w,up,ue)}
  const top=x=>{const ws=x.map(s=>s.w).filter(w=>w!=null);return ws.length?(as?Math.min(...ws):Math.max(...ws)):null};
  const cur=segs(e.sets),old=segs(prev.e.sets).map(s=>Object.assign({},s,{w:cv(s.w)}));
  const t1=strength?top((e.sets||[])):null,t0=strength?top((prev.e.sets||[]).map(s=>({w:cv(s.w)}))):null;
  const wUp=strength&&t1!=null&&t0!=null&&(as?t1<t0-1e-9:t1>t0+1e-9);
  const vol=x=>ex.kind==="cardio"?cardioMin({sets:x}):(as||ex.kind==="time"||!x.some(s=>s.w))?x.reduce((a,s)=>a+(s.r||0),0):x.reduce((a,s)=>a+(s.w||0)*(s.r||0),0);
  const v=ex.kind==="cardio"?cardioMin(e):vol(cur),pv=ex.kind==="cardio"?cardioMin(prev.e):vol(old);
  if(!(pv>0))return{wUp,cls:"same",txt:"–"};
  const pct=Math.round((v-pv)/pv*100),tip="上次 "+md(prev.date)+":"+nf(Math.round(pv))+" → "+nf(Math.round(v));
  if(pct>0)return{wUp,cls:"up",txt:"+"+pct+"%",tip};if(pct<0)return{wUp,cls:"down",txt:pct+"%",tip};return{wUp,cls:"same",txt:"持平",tip}}
function renderHist(){const el=$("v-hist"),dates=allDates().slice().reverse(),cat=catalog();
  if(!dates.length){el.innerHTML='<div class="empty">'+(S.loaded||!S.db?"还没有训练记录。":"正在读取记录…")+'</div>';return}
  el.innerHTML=dates.map((d,di)=>{const dy=day(d),ents=dy.entries||{},dt=toDate(d);let body="";
    GROUPS.forEach(g=>{const xs=cat.filter(e=>e.group===g.k&&ents[e.id]);if(!xs.length)return;const f1=!body;body+='<div class="gp'+(f1?' gp1':'')+'"><i class="dot '+g.c+'"></i>'+g.k+'</div>'+(f1?'<span class="hh">重量</span><span class="hh">次数</span><span class="hh hh-r">容量</span>':'');
      xs.forEach(ex=>{const e=ents[ex.id],c=histCmp(ex,e,d),sets=e.sets||[],time=ex.kind==="time",nm='<span class="hn">'+esc(ex.name)+(e.variant?'<small>'+esc(e.variant)+'</small>':'')+'</span>',hv='<span class="hv '+c.cls+'"'+(c.tip?' title="'+esc(c.tip)+'"':'')+'>'+c.txt+'</span>';
        let mid;
        if(ex.kind==="cardio")mid='<span class="hm">'+esc(cardioText(ex,e))+'</span>';
        else if(!sets.length)mid='<span class="hm">'+esc(e.note||"")+'</span>';
        else{let w=time?'<span class="hu">秒</span>':histW(ex,e);if(c.wUp)w+='<i class="wup" title="重量突破">▲</i>';
          mid='<span class="hw">'+w+'</span><span class="hr">'+(sets.some(s=>s.r!=null)?cells(sets):'<span class="nr">未记次数</span>')+'</span>'}
        body+=nm+mid+hv+(e.note&&sets.length?'<span class="hnote">'+esc(e.note)+'</span>':'')})});
    const parts=[...new Set(cat.filter(e=>ents[e.id]).map(e=>e.part))].join("、");
    return '<details class="day hday" data-fold="h_'+d+'"'+(foldOpen("h_"+d,di===0)?' open':'')+'><summary class="day-h"><b>'+(dt.getMonth()+1)+'月'+dt.getDate()+'日</b><span class="sync">'+WD[dt.getDay()]+' · '+esc(parts||(Object.keys(ents).length+' 个动作'))+'</span><span class="sp"></span><span class="chev"></span></summary><div class="hg">'+body+'</div>'+(dy.note?'<div class="dn">备注:'+esc(dy.note)+'</div>':'')+'<div class="hd-f"><button data-act="editDay" data-d="'+d+'">修改这一天</button></div></details>'}).join("")}

const ALIAS={rdl:["罗马尼亚硬拉","rdl","直腿硬拉"],bulgarian:["保加利亚","bulgarian","分腿蹲"],hip_thrust:["臀推","hipthrust"],hip_abd:["髋外展"],hip_add:["髋内收","髋内展"],hack_squat:["哈克"],smith_squat:["史密斯深蹲"],deadlift:["硬拉"],squat:["深蹲"],leg_press:["腿举"],leg_ext:["腿屈伸","坐姿屈伸"],leg_curl:["腿弯举"],glute_bridge:["臀桥"],lunge:["箭步蹲","弓步"],calf_raise:["提踵"]};
function normName(t){return String(t||"").toLowerCase().replace(/[\s()()\[\]【】·・\-_]/g,"")}
function matchPreset(name){const n=normName(name);let best=null,score=0;
  libItems().forEach(it=>{[it.name,...(ALIAS[it.id]||[])].forEach(a=>{const k=normName(a);if(!k)return;const sc=n===k?100:(k.length>=2&&n.includes(k)?k.length:0);if(sc>score){score=sc;best=it}})});
  return score>=2?best:null}
function maybeMigrate(){if(!S.db||!S.loaded||!S.catReady||S.migrated||!S.catalog)return;S.migrated=true;
  const list=clone(S.catalog);const moves=[];
  list.filter(e=>String(e.id).startsWith("c_")).forEach(e=>{const it=matchPreset(e.name);if(it&&it.id!==e.id)moves.push([e.id,it])});
  if(!moves.length)return;
  moves.forEach(([cid,it])=>{const i=list.findIndex(e=>e.id===cid);const old=list[i];list.splice(i,1);
    const tgt=list.find(e=>e.id===it.id);if(tgt){if(!old.hidden)delete tgt.hidden}else{const n=clone(it);if(old.units)n.units=old.units;if(old.hidden)n.hidden=true;list.push(n)}
    Object.keys(S.days).forEach(d=>{const dy=day(d);const en=dy&&dy.entries;if(!en||!en[cid])return;const nd=clone(dy);const a=nd.entries[cid],b=nd.entries[it.id];
      if(b){b.sets=(b.sets||[]).concat(a.sets||[]);if(a.note)b.note=(b.note?b.note+" · ":"")+a.note}else nd.entries[it.id]=a;delete nd.entries[cid];saveDay(nd)})});
  saveCatalog(list)}
/* 要练的口径:每个部位「N 天前练完的,今天算要练」。默认 2(昨天练完的休息) */
const RULE_DEF=2,RULE_MIN=1,RULE_MAX=7;
/* 核对用:云端返回的字段顺序可能和写入时不同,按键名排序后再比较内容 */
function stableStr(v){if(Array.isArray(v))return "["+v.map(stableStr).join(",")+"]";if(v&&typeof v==="object")return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stableStr(v[k])).join(",")+"}";return JSON.stringify(v)}
/* 每次练几个动作算「练完」:设置里手动定了就用手动的;没定就按最近 8 次这个部位实际做的动作数取中位数 */
function autoTarget(xs,n){const ids=xs.map(e=>e.id),cs=[],t=todayStr(),ds=allDates();
  for(let i=ds.length-1;i>=0&&cs.length<8;i--){const d=ds[i];if(d>=t)continue;const en=(day(d)||{}).entries||{};const c=ids.filter(id=>en[id]).length;if(c>0)cs.push(c)}
  if(!cs.length)return Math.min(n,4);cs.sort((a,b)=>a-b);return Math.max(1,Math.min(n,cs[Math.floor(cs.length/2)]))}
function tgtManual(gk){const d=S.tgtDraft;if(d&&gk in d)return d[gk];const m=(S.tgt||{})[gk];return Number.isInteger(m)?m:null}
/* 做了这个部位任意 1 个动作,这天就算练过这个部位;做几个由用户自己把握 */
function partNeed(gk,xs,n){return 1}
function grpXs(gk){return catalog().filter(e=>!e.hidden&&groupOfBase(baseOf(e))===gk)}
function grpN(xs){return (xs.length&&xs.every(e=>e.kind==="cardio"||baseOf(e)==="拉伸"))?1:xs.length}
/* 导出:一个动作一行,每组一格(重量×次数) */
function exportRows(){const NS=8,H=["日期","星期","部位","动作","器械","单位","组数"];for(let k=1;k<=NS;k++)H.push("第"+k+"组");H.push("更多组","有氧内容","动作备注","当天备注");
  const lib=libItems(),find=id=>exById(id)||catalog().find(e=>e.id===id)||lib.find(e=>e.id===id)||{id,name:id},rows=[H];
  const one=(w,r)=>w==null||w===""?(r==null?"":String(r)):(r==null?String(w):w+"×"+r);
  const cell=x=>[one(x.w,x.r)].concat((x.d||[]).filter(y=>y&&(y.w!=null||y.r!=null)).map(y=>one(y.w,y.r))).join(" → ");
  allDates().forEach(d=>{const dy=day(d);if(!dy)return;const en=dy.entries||{},wd=WD[toDate(d).getDay()];let first=true;
    Object.keys(en).forEach(id=>{const ex=find(id),e=en[id]||{},b=baseOf(ex)||ex.part||"",u=unitOf(ex,e),dn=first?(dy.note||""):"";first=false;
      const ss=e.sets||[],r=[d,wd,b,ex.name,e.variant||"",u,ex.kind==="cardio"?"":ss.length];
      const cs=ex.kind==="cardio"?[]:ss.map(cell);for(let k=0;k<NS;k++)r.push(cs[k]||"");
      r.push(cs.slice(NS).join(" / "),ex.kind==="cardio"?cardioText(ex,e):"",e.note||"",dn);rows.push(r)});
    if(!Object.keys(en).length&&dy.note){const r=[d,wd,"","","","",""];for(let k=0;k<NS+2;k++)r.push("");r.push("",dy.note);rows.push(r)}});
  return rows}
function toCsv(rows){return "﻿"+rows.map(r=>r.map(v=>{v=String(v==null?"":v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\r\n")}

function ruleText(n){return n<=1?"练过就可以继续练(不休息)":(n-1===1?"练完休息 1 天":"练完休息 "+(n-1)+" 天")}
async function saveRules(){if(S.rulesSaving)return;const next={};HG.forEach(g=>next[g.k]=ruleCur(g.k));const tnext={};HG.forEach(g=>{const m=tgtManual(g.k);if(Number.isInteger(m))tnext[g.k]=m});S.rulesSaving=true;render();

function setCat(){return S.catDraft||catalog()}

function draftDiff(){if(!S.catDraft)return {n:0,add:[],del:[]};const vis=l=>new Map(l.filter(e=>!e.hidden).map(e=>[e.id,e.name]));
  const a=vis(catalog()),b=vis(S.catDraft);const add=[...b].filter(([k])=>!a.has(k)).map(x=>x[1]),del=[...a].filter(([k])=>!b.has(k)).map(x=>x[1]);return {n:add.length+del.length,add,del}}
async function saveDraft(){const list=S.catDraft;if(!list||S.saving)return;S.saving=true;render();

/* 聊天:私聊 + 群聊,端到端加密。

        群消息也写在发送者自己的 dm/<id>/m 下(g=群,gto=成员),用群密钥加密。第三个人读到的只有密文。

S.chatSeen={};S.pubs={};S.sent=[];S.recv={};S.recvG={};S.plain={};S.aes={};S.subs={};S.migrating={};S.chatWith=null;

const EC={name:"ECDH",namedCurve:"P-256"};

async function initChat(db){

async function aesFor(u){const p=u===S.uid?(S.myPub?{pub:S.myPub}:null):S.pubs[u];if(!p||!S.myPriv)return null;
  if(!S.aes[u])S.aes[u]=crypto.subtle.importKey("jwk",p.pub,EC,false,[]).then(pk=>crypto.subtle.deriveKey({name:"ECDH",public:pk},S.myPriv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]));

async function enc(u,text){const k=await aesFor(u);if(!k)throw new Error("nokey");return encWith(k,text)}

/* 颜色模式:跟随系统 / 暗色 / 亮色(只存在这台设备上) */
const HOST_THEME=document.documentElement.getAttribute("data-theme");
function applyTheme(){const r=document.documentElement,t=S.theme;
  if(t==="dark"||t==="light"){if(r.getAttribute("data-theme")!==t)r.setAttribute("data-theme",t)}
  else{if(HOST_THEME)r.setAttribute("data-theme",HOST_THEME);else r.removeAttribute("data-theme")}}
try{const t=localStorage.getItem("tl_theme");if(t==="dark"||t==="light")S.theme=t}catch(e){}
applyTheme();
new MutationObserver(()=>{if(S.theme!=="auto"&&document.documentElement.getAttribute("data-theme")!==S.theme)applyTheme()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
